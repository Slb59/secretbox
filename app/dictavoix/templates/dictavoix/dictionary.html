{% extends "base.html" %}

{% block title %}{{ block.super }} - {{ theme.name }}{% endblock %}

{% block content %}
    <div class="w-full max-w-5xl">
        <div class="mb-4 flex items-center justify-between gap-4">
            <div>
                <a href="{% url 'dictavoix:dashboard' %}" class="text-sm text-amber-900 underline underline-offset-2 hover:text-amber-700">Retour aux thèmes</a>
                <h1 class="mt-2 text-2xl font-semibold">Dictionnaire : {{ theme.name }}</h1>
            </div>
            <span id="word-count" class="text-sm text-stone-600">{{ theme.dictionary_words.count }} mot{{ theme.dictionary_words.count|pluralize }}</span>
        </div>

        <form id="dictionary-form" class="mb-4 flex flex-col gap-2 rounded-xl border border-stone-300 bg-white p-4 shadow-sm sm:flex-row sm:items-end">
            {% csrf_token %}
            <div class="flex-1">
                <label for="word" class="block text-sm font-medium text-stone-700">Mot</label>
                <input id="word" name="word" required maxlength="120" class="mt-1 w-full rounded border border-stone-300 px-3 py-2">
            </div>
            <div class="flex-1">
                <label for="pronunciation-hint" class="block text-sm font-medium text-stone-700">Aide à la prononciation</label>
                <input id="pronunciation-hint" name="pronunciation_hint" maxlength="255" class="mt-1 w-full rounded border border-stone-300 px-3 py-2">
            </div>
            <button type="submit" class="rounded bg-amber-500 px-4 py-2 font-medium text-white hover:bg-amber-600">Ajouter</button>
        </form>

        <p id="dictionary-error" class="mb-4 hidden rounded border border-red-300 bg-red-50 px-3 py-2 text-sm text-red-700"></p>
        <div id="dictionary-table" class="w-full"></div>
    </div>

    <link href="https://unpkg.com/tabulator-tables@5.4.4/dist/css/tabulator.min.css" rel="stylesheet">
    <script src="https://unpkg.com/tabulator-tables@5.4.4/dist/js/tabulator.min.js"></script>
    <script>
        (() => {
            const apiUrl = "{% url 'dictavoix:dictionary_api' theme.pk %}";
            const csrfToken = document.querySelector("[name=csrfmiddlewaretoken]").value;
            const errorElement = document.getElementById("dictionary-error");
            const countElement = document.getElementById("word-count");

            function showError(message) {
                errorElement.textContent = message;
                errorElement.classList.remove("hidden");
            }

            function updateCount() {
                const count = table.getDataCount("active");
                countElement.textContent = `${count} mot${count === 1 ? "" : "s"}`;
            }

            async function request(url, options = {}) {
                const response = await fetch(url, {
                    ...options,
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": csrfToken,
                        ...(options.headers || {})
                    }
                });
                const data = await response.json();
                if (!response.ok) {
                    const detail = data.error || Object.values(data.errors || {}).flat().join(" ");
                    throw new Error(detail || "Une erreur est survenue.");
                }
                return data;
            }

            const table = new Tabulator("#dictionary-table", {
                ajaxURL: apiUrl,
                layout: "fitColumns",
                placeholder: "Aucun mot dans ce thème.",
                columns: [
                    {title: "Mot", field: "word", editor: "input", headerFilter: "input", validator: "required"},
                    {title: "Aide à la prononciation", field: "pronunciation_hint", editor: "input", headerFilter: "input"},
                    {
                        title: "Actions",
                        formatter: () => "Supprimer",
                        hozAlign: "center",
                        cellClick: async (event, cell) => {
                            if (!window.confirm("Supprimer ce mot ?")) return;
                            try {
                                await request(apiUrl, {
                                    method: "DELETE",
                                    body: JSON.stringify({pk: cell.getRow().getData().pk})
                                });
                                cell.getRow().delete();
                                updateCount();
                            } catch (error) {
                                showError(error.message);
                            }
                        }
                    }
                ]
            });

            table.on("cellEdited", async (cell) => {
                try {
                    await request(apiUrl, {
                        method: "PATCH",
                        body: JSON.stringify(cell.getRow().getData())
                    });
                    errorElement.classList.add("hidden");
                } catch (error) {
                    showError(error.message);
                    table.replaceData();
                }
            });

            table.on("dataLoaded", updateCount);

            document.getElementById("dictionary-form").addEventListener("submit", async (event) => {
                event.preventDefault();
                const form = event.currentTarget;
                const data = Object.fromEntries(new FormData(form));
                delete data.csrfmiddlewaretoken;
                try {
                    const word = await request(apiUrl, {
                        method: "POST",
                        body: JSON.stringify(data)
                    });
                    table.addRow(word, true);
                    form.reset();
                    errorElement.classList.add("hidden");
                    updateCount();
                } catch (error) {
                    showError(error.message);
                }
            });
        })();
    </script>
{% endblock %}

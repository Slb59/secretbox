{% extends "base.html" %}
{% load i18n crispy_forms_tags static%}
{% block title %}{{ block.super }}{% endblock %}
{% block content %}   
    
    {% if messages %}
        <div class="mb-4 w-full">
            {% for message in messages %}
            <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                {{ message }}
            </div>
            {% endfor %}
        </div>
    {% endif %}


    <div class="w-full  ">


        <link 
            href="https://unpkg.com/tabulator-tables@5.4.4/dist/css/tabulator.min.css" 
            rel="stylesheet"
        >
        
        <link rel="stylesheet" href="{% static 'journaling/css/memos.css' %}">

        <style>
            #memos-table {
                width: 100%;
            }
            .tabulator-cell[data-field="description"] {
                white-space: normal;
                word-wrap: break-word;
                overflow-wrap: break-word;
                max-height: 4.5em;
                overflow: hidden;
            }
        </style>

        {% include "navbar.html" %}        

        <div id="memos-table" class="w-full "></div>

        <div id="start-day-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50">
            <div class="bg-amber-300 rounded-lg shadow-xl w-full max-w-md p-5">
                <h2 class="text-xl font-semibold mb-4">Démarrer la journée</h2>
                <label for="start-day-date" class="block text-sm font-medium text-slate-700 mb-2">Date</label>
                <input id="start-day-date" type="date" class="w-full border border-slate-300 rounded px-3 py-2 mb-4" />
                <div class="flex justify-end gap-2">
                    <button id="start-day-cancel" type="button" class="px-3 py-2 rounded bg-slate-200 hover:bg-slate-300">Annuler</button>
                    <button id="start-day-confirm" type="button" class="px-3 py-2 rounded bg-amber-500 text-white hover:bg-amber-700">Confirmer</button>
                </div>
            </div>
        </div>

        <script src="https://unpkg.com/tabulator-tables@5.4.4/dist/js/tabulator.min.js">
        </script>

        <script>
            window.memosConfig = {
                apiUrl: "{% url 'journaling:memos_api' %}",
                updateUrl: "{% url 'journaling:update_memo_api' %}",
                editUrlTemplate: "{% url 'journaling:edit_memo' 0 %}",
                deleteUrlTemplate: "{% url 'journaling:delete_memo' 0 %}",
                startDayUrl: "{% url 'journaling:start_day' %}",
                csrfToken: "{{ csrf_token }}"
            };
        </script>

        <script src="{% static 'journaling/js/memos.js' %}"></script>
    </div>
{% endblock %}

{% extends "base.html" %}
{% load i18n crispy_forms_tags %}
{% block title %}{{ block.super }}{% endblock %}
{% block content %}   
    
    {% if messages %}
        <div class="mb-4 w-full">
            {% for message in messages %}
            <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                {{ message }}
            </div>
            {% endfor %}
        </div>
    {% endif %}


    <div class="w-full  ">


        <link href="https://unpkg.com/tabulator-tables@5.4.4/dist/css/tabulator.min.css" rel="stylesheet">
        
        <style>
            #memos-table {
                width: 100%;
            }
            .tabulator-cell[data-field="description"] {
                white-space: normal;
                word-wrap: break-word;
                overflow-wrap: break-word;
                max-height: 4.5em;
                overflow: hidden;
            }
        </style>

        {% include "navbar.html" %}        

        

        <div id="memos-table" class="w-full "></div>

        <div id="start-day-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50">
            <div class="bg-amber-300 rounded-lg shadow-xl w-full max-w-md p-5">
                <h2 class="text-xl font-semibold mb-4">Démarrer la journée</h2>
                <label for="start-day-date" class="block text-sm font-medium text-slate-700 mb-2">Date</label>
                <input id="start-day-date" type="date" class="w-full border border-slate-300 rounded px-3 py-2 mb-4" />
                <div class="flex justify-end gap-2">
                    <button id="start-day-cancel" type="button" class="px-3 py-2 rounded bg-slate-200 hover:bg-slate-300">Annuler</button>
                    <button id="start-day-confirm" type="button" class="px-3 py-2 rounded bg-amber-500 text-white hover:bg-amber-700">Confirmer</button>
                </div>
            </div>
        </div>

        <script src="https://unpkg.com/tabulator-tables@5.4.4/dist/js/tabulator.min.js"></script>
        <script>
            (function(){
                const apiUrl = "{% url 'journaling:memos_api' %}";
                const editUrlTemplate = "{% url 'journaling:edit_memo' 0 %}";
                const deleteUrlTemplate = "{% url 'journaling:delete_memo' 0 %}";

                function pkReplace(template, pk){
                    return template.replace(/0(?![0-9])/g, pk);
                }

                // Save memo changes via API
                function saveMemoChanges(rowData){
                    const updateUrl = "{% url 'journaling:update_memo_api' %}";
                    console.log(">>> saveMemoChanges appelée");
                    console.log("rowData =", rowData);
                    fetch(updateUrl, {
                        method: "PATCH",
                        headers: {
                            "Content-Type": "application/json",
                            "X-CSRFToken": "{{ csrf_token }}"
                        },
                        body: JSON.stringify({
                            pk: rowData.pk,
                            state: rowData.state,
                            duration: rowData.duration,
                            description: rowData.description,
                            appointment: rowData.appointment,
                            category: rowData.category,
                            who: rowData.who,
                            place: rowData.place,
                            periodic: rowData.periodic,
                            planned_date: rowData.planned_date,
                            priority: rowData.priority,
                            done_date: rowData.done_date,
                            note: rowData.note
                        })
                    })
                    .then(r => r.json())
                    .then(data => {
                        if(!data.success){
                            alert("Erreur lors de la sauvegarde: " + (data.error || "Erreur inconnue"));
                        }
                    })
                    .catch(err => {
                        alert("Erreur lors de la sauvegarde: " + err.message);
                    });
                }

                const startDayModal = document.getElementById("start-day-modal");
                const startDayDateInput = document.getElementById("start-day-date");
                const startDayConfirmButton = document.getElementById("start-day-confirm");
                const startDayCancelButton = document.getElementById("start-day-cancel");

                function setStartDayDefaultDate(){
                    if (startDayDateInput) {
                        const now = new Date();
                        const localDate = new Date(now.getTime() - (now.getTimezoneOffset() * 60000));
                        startDayDateInput.value = localDate.toISOString().split('T')[0];
                    }
                }

                const startDayButton = document.getElementById("start-day");
                if (startDayButton) {
                    startDayButton.addEventListener("click", function(){
                        console.log(">>> click on startDayButton");
                        setStartDayDefaultDate();
                        if (startDayModal) {
                            console.log(">>> startDayModal is true, removing hidden class");
                            startDayModal.classList.remove("hidden");
;
                            console.log(
                                "classes après modification :",
                                startDayModal.className
                            );
                            console.log(
                                "display calculé :",
                                window.getComputedStyle(startDayModal).display
                            );
                        }
                    });
                }

                if (startDayCancelButton && startDayModal) {
                    startDayCancelButton.addEventListener("click", function(){
                        startDayModal.classList.add("hidden");
                    });
                }

                if (startDayConfirmButton) {
                    startDayConfirmButton.addEventListener("click", function(){
                        const payload = new FormData();
                        const fallbackDate = (() => {
                            const now = new Date();
                            const localDate = new Date(now.getTime() - (now.getTimezoneOffset() * 60000));
                            return localDate.toISOString().split('T')[0];
                        })();
                        payload.append("planned_date", startDayDateInput ? startDayDateInput.value : fallbackDate);

                        fetch("{% url 'journaling:start_day' %}", {
                            method: "POST",
                            headers: {
                                "X-CSRFToken": "{{ csrf_token }}",
                                "X-Requested-With": "XMLHttpRequest"
                            },
                            body: payload
                        })
                        .then(response => response.json())
                        .then(data => {
                            if (!data.success) {
                                throw new Error(data.error || "Erreur inconnue");
                            }
                            if (startDayModal) {
                                startDayModal.classList.add("hidden");
                            }
                            location.reload();
                        })
                        .catch(err => {
                            alert("Erreur lors du démarrage de la journée: " + err.message);
                        });
                    });
                }

                // create Tabulator
                const table = new Tabulator("#memos-table", {
                    placeholder: "Aucune donnée",
                    pagination: "local",
                    paginationSize: 25,
                    reactiveData: true,
                    columns:[
                        {   title:"État", 
                            field:"state", headerFilter:"list", 
                            headerFilterParams:{values:{}}, 
                            editor:"list", 
                            editorParams:{values:{}}
                        },
                        {   title:"Durée", 
                            field:"duration", 
                            hozAlign:"center", 
                            headerFilter:true, 
                            editor:"input",
                            mutatorEdit:function(value){ return Number(value) || 0; },
                            sorter:function(a, b){
                                const av = Number(a) || 0;
                                const bv = Number(b) || 0;
                                return av - bv;
                            },
                            formatter:function(cell){
                                const val = Number(cell.getValue());
                                return Number.isFinite(val) ? val : 0;
                            }
                        },
                        {   title:"Description", 
                            field:"description",
                            headerFilter:"input", 
                            headerFilterPlaceholder:"Filtrer...", 
                            width:400 , variableHeight:true, 
                            editor:"textarea",
                            formatter:function(cell){
                                const val = cell.getValue();
                                if(!val) return "";
                                const lines = val.split("\n");
                                if(lines.length > 3){
                                    return lines.slice(0,3).join("<br>") + "<br>...";
                                }
                                return val.replace(/\n/g, "<br>");
                            }                            
                        },
                        {title:"Rendez-vous", field:"appointment", headerFilter:"list", headerFilterParams:{values:{}}, editor:"list", editorParams:{values:{}}},
                        {title:"Catégorie", field:"category", headerFilter:"list", headerFilterParams:{values:{}}, editor:"list", editorParams:{values:{}}},
                        {title:"Qui", field:"who", headerFilter:"input", editor:"input"},
                        {title:"Lieu", field:"place", headerFilter:"list", headerFilterParams:{values:{}}, editor:"list", editorParams:{values:{}}},
                        {title:"Fréquence", field:"periodic", headerFilter:"list", headerFilterParams:{values:{}}, editor:"list", editorParams:{values:{}}},
                        {title:"Priorité", field:"priority", headerFilter:"list", headerFilterParams:{values:{}}, editor:"list", editorParams:{values:{}}},
                        {   title:"Planifié", 
                            field:"planned_date", 
                            headerFilter:"date", 
                            editor:"date",
                            sorter:"date",
                            formatter:function(cell){
                                const val = cell.getValue();
                                if(!val) return "";
                                const d = new Date(val);
                                return d.toLocaleDateString("fr-FR");
                            }
                        },
                        {title:"Fait", field:"done_date", headerFilter:true, editor:"date", formatter:function(cell){
                            const val = cell.getValue();
                            if(!val) return "";
                            const d = new Date(val);
                            return d.toLocaleDateString("fr-FR");
                        }},
                        {title:"Note", field:"note", headerFilter:"input", editor:"textarea", width:200},
                        {title:"Actions", field:"pk", hozAlign:"center", formatter:function(cell, formatterParams){
                            const pk = cell.getValue();
                            const edit = pkReplace(editUrlTemplate, pk);
                            const del = pkReplace(deleteUrlTemplate, pk);
                            return `<a href="${edit}" class="px-2 py-1 bg-amber-200 rounded mr-1">Éditer</a>` +
                                   `<form method="post" action="${del}" style="display:inline;" onsubmit="return confirm('Supprimer ?');">` +
                                   `<input type=hidden name=csrfmiddlewaretoken value="{{ csrf_token }}">` +
                                   `<button type="submit" class="px-2 py-1 bg-rose-200 rounded">Suppr</button></form>`;
                        }}
                    ],

                });

                table.on("cellEdited", function(cell){
                        console.log(">>> cellEdited déclenché");
                        console.log("Champ :", cell.getField());
                        console.log("Valeur :", cell.getValue());
                        console.log("Ligne :", cell.getRow().getData());
                        saveMemoChanges(cell.getRow().getData());
                    }
                );

                // fetch data including any current query params so server-side filters apply
                fetch(apiUrl + window.location.search)
                    .then(r => r.json())
                    .then(data => {
                        const normalizedData = data
                            .map(row => ({
                                ...row,
                                duration: Number(row.duration) || 0,
                            }))
                            .sort((a, b) => (Number(a.duration) || 0) - (Number(b.duration) || 0));

                        table.clearSort();
                        table.setData(normalizedData);
                        table.setSort([{column: "duration", dir: "asc"}]);

                        // Collect unique state values from data for the select filter
                        const stateValues = [...new Set(data.map(row => row.state).filter(s => s))];
                        table.getColumn("state").updateDefinition({
                            headerFilterParams: {values: stateValues.sort()},
                            editorParams: {values: stateValues.sort()}
                        });

                        // Collect unique priority values from data for the select filter
                        const priorityValues = [...new Set(data.map(row => row.priority).filter(s => s))];
                        table.getColumn("priority").updateDefinition({
                            headerFilterParams: {values: priorityValues.sort()},
                            editorParams: {values: priorityValues.sort()}
                        });

                        // Collect unique appointment values from data for the select filter
                        const appointmentValues = [...new Set(data.map(row => row.appointment).filter(s => s))];
                        table.getColumn("appointment").updateDefinition({
                            headerFilterParams: {values: appointmentValues.sort()},
                            editorParams: {values: appointmentValues.sort()}
                        });

                        // Collect unique category values from data for the select filter
                        const categoryValues = [...new Set(data.map(row => row.category).filter(s => s))];
                        table.getColumn("category").updateDefinition({
                            headerFilterParams: {values: categoryValues.sort()},
                            editorParams: {values: categoryValues.sort()}
                        });

                        // Collect unique place values from data for the select filter
                        const placeValues = [...new Set(data.map(row => row.place).filter(s => s))];
                        table.getColumn("place").updateDefinition({
                            headerFilterParams: {values: placeValues.sort()},
                            editorParams: {values: placeValues.sort()}
                        });

                        // Collect unique periodic values from data for the select ())
                        const periodicValues = [...new Set(data.map(row => row.periodic).filter(s => s))];
                        table.getColumn("periodic").updateDefinition({
                            headerFilterParams: {values: periodicValues.sort()},
                            editorParams: {values: periodicValues.sort()}
                        });

                        // apply URL-based filters to Tabulator (for persistence)
                        const params = new URLSearchParams(window.location.search);
                        const keys = ["description","who","place","category","state","priority"];
                        let hasStateParam = false;
                        let hasPriorityParam = false;
                        keys.forEach(k => {
                            const v = params.get(k);
                            if(v){
                                if(k === "state") hasStateParam = true;
                                if(k === "priority") hasPriorityParam = true;
                                table.addFilter(k,"like",v);
                            }
                        });

                        // Set initial state filter via header filter if no state param in URL
                        if(!hasStateParam){
                            table.setHeaderFilterValue("state", "A faire");
                        }
                        // Set initial priority filter via header filter if no priority param in URL
                        if(!hasPriorityParam){
                            table.setHeaderFilterValue("priority", "matin");
                        }
                        // set initial planned_date filter via header filter to the minimum date in the data if no planned_date param in URL
                        if(!params.get("planned_date")){
                            const validDates = data
                                .filter(row => row.state === "A faire")
                                .map(row => row.planned_date)
                                .filter(d => d);
                            if(validDates.length > 0){
                                const minDate = new Date(Math.min(...validDates.map(d => new Date(d))));
                                table.setHeaderFilterValue("planned_date", minDate.toISOString().split('T')[0]);
                            }
                        }
                    });
                
                

                // Add a new row to the table on button click
                const addButton = document.getElementById("reactivity-add");
                if (addButton) {
                    addButton.addEventListener("click", function(){
                        const activeState = table.getHeaderFilterValue ? (table.getHeaderFilterValue("state") || "A faire") : "A faire";
                        const activePriority = table.getHeaderFilterValue ? (table.getHeaderFilterValue("priority") || "matin") : "matin";
                        const activePlannedDate = table.getHeaderFilterValue ? table.getHeaderFilterValue("planned_date") : "";

                        const newRow = {
                            state: activeState,
                            duration: 10,
                            description: "Nouvelle tâche",
                            appointment: "",
                            category: "Organisation",
                            who: "slb",
                            place: "partout",
                            periodic: "01-une seule fois",
                            planned_date: activePlannedDate,
                            priority: activePriority,
                            done_date: "",
                            note: ""
                        };

                        table.addRow(newRow);
                    });
                }

                function applyUrlFiltersToTable(){
                    const params = new URLSearchParams(window.location.search);
                    const mapping = ['description','who','place','category','state','priority'];
                    mapping.forEach(k=>{
                        const v = params.get(k);
                        if(v){ table.addFilter(k,'like',v); }
                    });
                }

                function updateUrlParam(key, value){
                    const params = new URLSearchParams(window.location.search);
                    if(value){ params.set(key, value); }
                    else{ params.delete(key); }
                    const newUrl = window.location.pathname + '?' + params.toString();
                    history.replaceState(null, '', newUrl);
                }
            })();
        </script>
    </div>
{% endblock %}

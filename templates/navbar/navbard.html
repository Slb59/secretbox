{% load static %}

<!-- Lateral right menu -->

{% if user.is_authenticated %}
    <!-- Chip for disconnect -->
    <form method="post" action="{% url 'account:logout' %}">
        {% csrf_token %}
        <button type="submit" class="round-icon round-icon--rose" title="Déconnexion">
            <svg 
            xmlns="http://www.w3.org/2000/svg" 
            width="24" height="24" 
            viewBox="0 0 24 24" 
            fill="none" 
            stroke="currentColor" 
            stroke-width="2" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            class="lucide lucide-log-out-icon lucide-log-out">
            <path d="m16 17 5-5-5-5"/>
            <path d="M21 12H9"/>
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            </svg>
        </button>
    </form>

    <!-- Chip for profil -->
    <a href="{% url 'account:profile' %}" class="round-icon round-icon--rose" title="Profile">
        <svg 
        xmlns="http://www.w3.org/2000/svg" 
        width="24" height="24" 
        viewBox="0 0 24 24" 
        fill="none" 
        stroke="currentColor" 
        stroke-width="2" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        class="lucide lucide-circle-user-round-icon lucide-circle-user-round">
        <path d="M17.925 20.056a6 6 0 0 0-11.851.001"/>
        <circle cx="12" cy="11" r="4"/>
        <circle cx="12" cy="12" r="10"/>
        </svg>
    </a>
{% endif %}

{% extends "base.html" %}
{% load i18n crispy_forms_tags %}
{% block title %}{{ block.super }}{% endblock %}
{% block content %}   
    
    {% if messages %}
        <div class="mb-4 w-full">
            {% for message in messages %}
            <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                {{ message }}
            </div>
            {% endfor %}
        </div>
    {% endif %}

    {% include './navbar.html' %}

 
 
    <div class="w-full">
        <div class="flex items-center space-x-2 mb-2">
            <input id="global-search" type="search" placeholder="Recherche globale..." class="px-3 py-2 rounded border" />
            <button id="reset-filters" class="px-3 py-2 bg-gray-200 rounded">Réinitialiser</button>
        </div>

        <link href="https://unpkg.com/tabulator-tables@5.4.4/dist/css/tabulator.min.css" rel="stylesheet">

        <div id="memos-table" class="w-full"></div>

        <script src="https://unpkg.com/tabulator-tables@5.4.4/dist/js/tabulator.min.js"></script>
        <script>
            (function(){
                const apiUrl = "{% url 'journaling:memos_api' %}";
                const editUrlTemplate = "{% url 'journaling:edit_memo' 0 %}";
                const deleteUrlTemplate = "{% url 'journaling:delete_memo' 0 %}";

                function pkReplace(template, pk){
                    return template.replace(/0(?![0-9])/g, pk);
                }

                // create Tabulator
                const table = new Tabulator("#memos-table", {
                    layout: "fitColumns",
                    placeholder: "Aucune donnée",
                    pagination: "local",
                    paginationSize: 25,
                    reactiveData: true,
                    columns:[
                        {title:"État", field:"state", headerFilter:true},
                        {title:"Durée", field:"duration", hozAlign:"center", headerFilter:true},
                        {title:"Description", field:"description", headerFilter:"input", headerFilterPlaceholder:"Filtrer...", widthGrow:2},
                        {title:"Rendez-vous", field:"appointment", headerFilter:true},
                        {title:"Catégorie", field:"category", headerFilter:true},
                        {title:"Qui", field:"who", headerFilter:"input"},
                        {title:"Lieu", field:"place", headerFilter:true},
                        {title:"Fréquence", field:"periodic", headerFilter:true},
                        {title:"Planifié", field:"planned_date", headerFilter:true},
                        {title:"Priorité", field:"priority", headerFilter:true},
                        {title:"Fait", field:"done_date", headerFilter:true},
                        {title:"Note", field:"note", headerFilter:"input"},
                        {title:"Actions", field:"pk", hozAlign:"center", formatter:function(cell, formatterParams){
                            const pk = cell.getValue();
                            const edit = pkReplace(editUrlTemplate, pk);
                            const del = pkReplace(deleteUrlTemplate, pk);
                            return `<a href="${edit}" class="px-2 py-1 bg-amber-200 rounded mr-1">Éditer</a>` +
                                   `<form method="post" action="${del}" style="display:inline;" onsubmit="return confirm('Supprimer ?');">` +
                                   `<input type=hidden name=csrfmiddlewaretoken value="{{ csrf_token }}">` +
                                   `<button type="submit" class="px-2 py-1 bg-rose-200 rounded">Suppr</button></form>`;
                        }}
                    ],
                });

                // fetch data including any current query params so server-side filters apply
                fetch(apiUrl + window.location.search)
                    .then(r => r.json())
                    .then(data => {
                        table.setData(data);

                        // apply simple URL-based filters to Tabulator (for persistence)
                        const params = new URLSearchParams(window.location.search);
                        const keys = ["description","who","place","category","state","priority"];
                        keys.forEach(k => {
                            const v = params.get(k);
                            if(v){
                                table.addFilter(k,"like",v);
                            }
                        });
                    });

                // global search
                document.getElementById('global-search').addEventListener('input', function(e){
                    const v = e.target.value;
                    if(!v){
                        table.clearFilter(true);
                        // reapply header filters if any
                        applyUrlFiltersToTable();
                        return;
                    }
                    table.setFilter([
                        {field:"description", type:"like", value:v},
                        {field:"who", type:"like", value:v},
                        {field:"place", type:"like", value:v},
                    ]);
                    updateUrlParam('q', v);
                });

                document.getElementById('reset-filters').addEventListener('click', function(){
                    history.replaceState(null, '', window.location.pathname);
                    table.clearFilter(true);
                    document.getElementById('global-search').value = '';
                });

                function applyUrlFiltersToTable(){
                    const params = new URLSearchParams(window.location.search);
                    const mapping = ['description','who','place','category','state','priority'];
                    mapping.forEach(k=>{
                        const v = params.get(k);
                        if(v){ table.addFilter(k,'like',v); }
                    });
                }

                function updateUrlParam(key, value){
                    const params = new URLSearchParams(window.location.search);
                    if(value){ params.set(key, value); }
                    else{ params.delete(key); }
                    const newUrl = window.location.pathname + '?' + params.toString();
                    history.replaceState(null, '', newUrl);
                }
            })();
        </script>
    </div>
{% endblock %}

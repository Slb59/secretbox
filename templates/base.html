{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <title>{% block title %}SecretBox{% endblock %}</title>
    {% include "base/head.html"%}
    <link href='{% static "css/dist/styles.css" %}'' rel="stylesheet">
</head>
<body class="body-screen">
    <div class="header">
        <span class="logo">SecretBox</span>
        <span class="user">
        Bonjour {{user.trigram}}
        </span>
    </div>
    <div class="content">
        {% block content %}
        {% endblock %}
    </div>
    <footer class="footer">
        {% include "base/footer.html"%}
    </footer>
</body>
</html>
